name: Sincronizar páginas de viviendas y blog

# Genera /viviendas/<slug>/index.html para cada vivienda activa, y
# /blog/<slug>/index.html para cada entrada de blog publicada, ambas desde
# Supabase, y hace commit/push de los cambios usando el token automático de
# la Action (GITHUB_TOKEN), que tiene permiso de escritura sobre este repo
# independientemente de cualquier integración externa conectada.

on:
  workflow_dispatch: {}
  schedule:
    # Cada día a las 05:00 UTC (≈ 07:00 hora de España en verano, 06:00 en invierno)
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar páginas de viviendas y blog
        run: node scripts/generate-viviendas.js

      - name: Commit y push si hay cambios
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios, nada que subir."
            exit 0
          fi
          git add viviendas/ blog/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en viviendas/, blog/ ni en sitemap.xml, nada que subir."
            exit 0
          fi
          git commit -m "Actualizar páginas de /viviendas/ y /blog/ (automático)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Avisa a Bing (y otros buscadores compatibles con IndexNow) de las URLs del sitio
      # cuando se han regenerado páginas, para que las rastreen antes.
      - name: Avisar a Bing con IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: |
          KEY="5322becc567e75449cb6eb5d13b8d156"
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g' | jq -R . | jq -s .)
          BODY=$(jq -n --arg host "conilvacaciones.github.io" --arg key "$KEY" --arg loc "https://conilvacaciones.github.io/$KEY.txt" --argjson urls "$URLS" '{host:$host,key:$key,keyLocation:$loc,urlList:$urls}')
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY" || true
